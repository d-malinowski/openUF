name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build release tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The release notes are the annotated tag's message. checkout can leave
      # the tag lightweight on a tag push, so fetch the tag object itself.
      - name: Read release notes from the tag
        id: notes
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          echo "name=$(git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents:subject)')" >> "$GITHUB_OUTPUT"
          git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents:body)' > release-notes.md

      - name: Install Lua and dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1 liblua5.1-dev lua-bitop luarocks openssl
          sudo ln -sf /usr/bin/lua5.1 /usr/local/bin/lua
          sudo luarocks --lua-version 5.1 install lua-cjson LUA_INCDIR=/usr/include/lua5.1

      # dist.sh ships a comment-stripped tree (roughly half the bytes; OpenWrt
      # flash is scarce) and --verify proves it is bytecode-identical to the
      # source and still passes the suite before anything is published.
      - name: Build openuf.tar.gz
        run: sh tools/dist.sh --verify

      - name: Generate checksum
        run: sha256sum openuf.tar.gz > openuf.tar.gz.sha256

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            openuf.tar.gz
            openuf.tar.gz.sha256
          name: ${{ steps.notes.outputs.name }}
          body_path: release-notes.md
          generate_release_notes: true
